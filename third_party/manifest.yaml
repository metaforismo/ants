# Third-party dependency manifest.
#
# Source of verified provenance for every adopted dependency: license,
# pinned version, adoption decision, and review notes. scripts/manifestcheck
# (make manifest-check) fails when a direct go.mod dependency is missing here.
#
# Rules (ADR-0008): permissive licenses only in-process (Apache/MIT/BSD/MPL);
# pin exact versions; record upstream health notes at adoption time.

version: 1
dependencies:
  - module: gopkg.in/yaml.v3
    version: v3.0.1
    license: MIT
    decision: adopt
    purpose: Configuration file parsing and the capability catalog format.
      Strict decoding (unknown fields rejected) is enforced by callers.
    notes: Mature, minimal transitive surface. Upstream is in maintenance
      mode with wide industry usage; API stable for years.

  - module: github.com/jackc/pgx/v5
    version: v5.7.6
    license: MIT
    decision: adopt
    purpose: PostgreSQL connectivity for migrations (pgx stdlib database/sql
      driver). The planned domain-store adapter uses the same driver.
    notes: Reference PostgreSQL driver for Go per master plan section 14.6.

  - module: github.com/prometheus/client_golang
    version: v1.24.1
    license: Apache-2.0
    decision: adopt
    purpose: Prometheus instrumentation and text exposition for the API
      edge, outbox dispatcher, and run worker (ADR-0014). Instance-owned
      registry served at /metrics behind metrics.enabled.
    notes: De-facto Go instrumentation standard per master plan OSS atlas
      section 14.6; Apache-2.0 satisfies ADR-0008. OpenTelemetry remains a
      later wave and can scrape this registry, so the choice is not
      foreclosed.

  - module: github.com/lestrrat-go/jwx/v2
    version: v2.1.7
    license: MIT
    decision: adopt
    purpose: JWS/JWK/JWT parsing primitives for the OIDC resource-server
      verifier (ADR-0019) — signature verification with strict kid+alg key
      selection and JWKS document parsing. Discovery validation, key-cache
      lifecycle, rotation policy, and claim mapping stay in internal/authn.
    notes: The master-plan OSS atlas (section 14.4) listed lestrrat-go/jwx
      for evaluation in exactly this role. Actively maintained, widely
      deployed, purpose-built JOSE stack; adopting it avoids hand-rolled
      signature/key-selection code where algorithm-confusion bugs live.
      Hand-rolling was rejected per ADR-0008 (reuse mature components for
      security-critical primitives).

  - module: openapi-typescript (npm, packages/contracts devDependency)
    version: 7.13.0
    license: MIT
    decision: adopt
    purpose: Generates TypeScript types from openapi/v1/openapi.yaml so web
      clients consume generated shapes instead of hand-copied ones.
    notes: Zero-runtime-dependency generator; output committed for review.

  - module: openid-client (npm, apps/web dependency)
    version: 6.8.7
    license: MIT
    decision: adopt
    purpose: OIDC relying-party protocol engine for the web console
      (ADR-0020) — discovery, Authorization Code + PKCE (S256) URL
      construction, code exchange with ID-token validation (issuer,
      audience, nonce), refresh grant, end-session URL.
    notes: Maintained by panva; certified test coverage and the de-facto
      Node OIDC library per master plan OSS atlas posture on security-
      critical primitives. Session lifecycle, cookie sealing, CSRF, and
      identity mapping stay in apps/web (ADR-0020); hand-rolling any of the
      protocol steps was rejected per ADR-0008.

  - module: next (npm, apps/web dependency)
    version: 16.3.2
    license: MIT
    decision: adopt
    purpose: App Router server rendering and route handlers hosting the BFF
      (session routes and the /v1 proxy).
    notes: Named by master plan sections 2/14.7 for the web/PWA client.
      Server-only session handling relies on Next server semantics; no
      tokens are emitted into client bundles.

  - module: react / react-dom (npm, apps/web dependencies)
    version: 19.2.8
    license: MIT
    decision: adopt
    purpose: UI runtime for the console surface.
    notes: Paired with Next 16 App Router; pinned to identical versions.

  - module: "@tanstack/react-query (npm, apps/web dependency)"
    version: 5.102.0
    license: MIT
    decision: adopt
    purpose: Server-state management for operational data (thread list,
      workspace, run panel) with bounded polling and typed retry.
    notes: Named by master plan OSS atlas section 14.7 for exactly this
      role; polling intervals live in components, never behind abstractions.

  - module: "@playwright/test (npm, apps/web devDependency)"
    version: 1.62.1
    license: Apache-2.0
    decision: adopt
    purpose: Browser E2E suite against the disposable local stack of
      scripts/test-web-e2e.sh — login, operate, observe, session security
      states, responsive viewport behavior.
    notes: Named by master plan OSS atlas section 14.7. Browsers install
      into developer/CI caches only; the suite runs exclusively against
      loopback fixtures.
