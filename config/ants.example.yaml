# Ants example configuration.
#
# Layering: built-in defaults < this file < ANTS_* environment variables.
# Every field shown here overrides a documented default; delete fields to fall
# back to the default. Unknown keys are rejected at startup.
#
# Secrets never belong in files. Provide the Postgres DSN via
# ANTS_STORE_POSTGRES_DSN; diagnostics always render secrets as [REDACTED].

server:
  # Loopback by default. Exposing Ants publicly requires an authenticated edge
  # and an https identity provider (see auth.oidc below).
  http_addr: "127.0.0.1:8080"
  read_timeout: 10s
  write_timeout: 30s
  # Idle keep-alive connections are closed after this long so load balancers
  # and hostile clients cannot hold sockets forever.
  idle_timeout: 120s
  shutdown_timeout: 10s
  # Bounds each /readyz dependency check; a slow database must fail the probe
  # fast instead of hanging the health endpoint.
  readiness_timeout: 2s

auth:
  oidc:
    # Resource-server OIDC (ADR-0019): authenticated routes accept
    # `Authorization: Bearer <access token>` issued by this provider. Leave
    # the whole block unset to refuse every authenticated request with
    # problem code authentication_not_configured — there is no development
    # bypass anywhere in the configuration surface.
    #
    # issuer_url names the realm/deployment; it must be https unless it
    # literally serves from loopback (local Keycloak for development).
    # audience must appear in every accepted token's `aud` claim.
    # tenant_claim names the verified claim carrying the Ants tenant slug;
    # the claim value is grammar-checked and resolved against the tenant
    # store on every request.
    # issuer_url: "http://127.0.0.1:8081/realms/ants"
    # audience: "ants-api"
    tenant_claim: "ants_tenant"
    # Cached JWKS documents refresh lazily after this long, plus once more on
    # any unknown key id (rotation), rate-limited to one fetch per second.
    jwks_refresh_interval: 15m
    # Tolerance for IdP clock drift on exp/nbf checks.
    clock_skew: 30s
    # Bounds discovery/JWKS HTTP exchanges.
    http_timeout: 5s

store:
  # memory: deterministic zero-dependency mode for development and tests.
  # postgres: durable mode; requires ANTS_STORE_POSTGRES_DSN.
  mode: memory
  # Connection pool bounds for postgres mode (defaults shown).
  # pool:
  #   max_open_conns: 10
  #   max_idle_conns: 5
  #   conn_max_lifetime: 30m

outbox:
  # The durable event dispatcher (ADR-0011). It leases queued messages in
  # bounded batches, retries classified failures with exponential backoff,
  # and dead-letters them after max_attempts. Delivery is at-least-once.
  batch_size: 100
  interval: 250ms
  lease: 30s
  max_attempts: 5
  retry_backoff_base: 500ms
  retention:
    # Bounded GC of terminal rows (ADR-0016). A horizon of zero exempts its
    # class, so the defaults below are INERT: nothing is ever deleted until
    # you set an explicit nonzero horizon. Eligible: delivered rows older
    # than delivered_after, discarded rows (operator-triaged poison) older
    # than discarded_after — give the latter a longer horizon. Pending,
    # leased, and dead rows are never eligible; events and audit history are
    # unreachable. Each round deletes at most batch_size rows — delivered
    # victims first, oldest-terminal-first within each class; serve runs
    # rounds every interval once any horizon is set, and
    # `ants outbox retention preview|sweep --yes` drives them manually.
    delivered_after: 0s
    discarded_after: 0s
    batch_size: 500
    interval: 1h

orchestrator:
  max_parallel_tasks: 4
  # Hard budget caps enforced per run; exceeding them fails the run
  # explicitly with a budget finding instead of overspending silently.
  max_tasks_per_run: 8
  max_exec_ops_per_run: 64
  task_timeout: 2m
  stage_timeout: 5m
  max_attempts: 3
  retry_backoff_base: 100ms

sandbox:
  # process: executes allow-listed commands inside a rooted workspace
  # directory on this host. It is NOT a security boundary; microVM drivers
  # arrive with Horizon 2. fake: records scripted effects without executing.
  driver: process
  # Empty means a per-run temporary directory managed by the driver.
  work_root: ""

scm:
  # local_git: real git commits/diffs inside the sandbox workspace root.
  # memory: in-memory file trees with content-derived SHAs, for hermetic tests.
  driver: local_git

policy:
  # Local commits inside task workspaces may be allowed. Pushing, merging to
  # protected branches, network access, secret reads, destructive host
  # mutation, and global package installs are denied unconditionally; there is
  # no configuration flag to re-enable them in this release.
  allow_local_commits: true

worker:
  # The process-level run executor (ADR-0012 part 2). It claims durable run
  # claims in bounded batches and drives them through the engine; batch_size
  # and concurrency cap one round and simultaneous executions respectively.
  batch_size: 8
  interval: 250ms
  # Claim lease renewed by heartbeat_every; the lease must be at least three
  # times the heartbeat interval so two missed beats never expire a live
  # worker, and a crashed worker's runs become reclaimable after one lease.
  lease: 30s
  heartbeat_every: 5s
  # Bounds terminal persistence after execution ends; it deliberately runs
  # detached from shutdown cancellation so final states always land.
  cleanup_timeout: 10s
  concurrency: 4
  # Dispatch budget per claim (first dispatch plus reclaims). A claim
  # acquired more often than this converges its run — cancelled if it never
  # started, failed with run_attempts_exhausted otherwise — instead of being
  # reclaimed forever. Counts every acquisition, including shutdown-released
  # ones, so leave headroom for deploy churn.
  max_attempts: 3

metrics:
  # Prometheus exposition at /metrics on the API listener (ADR-0014).
  # Enabled by default so an operable system measures itself; series carry
  # fixed-vocabulary labels only (route patterns, statuses, states) and no
  # tenant or resource identifiers. Set false to remove the route entirely.
  enabled: true

log:
  level: info
  format: text
