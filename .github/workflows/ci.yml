name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go build, lint, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ants
          POSTGRES_PASSWORD: ants
          POSTGRES_DB: ants_ci
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U ants"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_PG_DSN: postgres://ants:ants@127.0.0.1:54329/ants_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "unformatted files:"
            echo "$out"
            gofmt -d .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Staticcheck (pinned)
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Manifest check
        run: go run ./scripts/manifestcheck

      - name: Unit, contract, and PostgreSQL integration tests
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Build binaries
        run: |
          go build -o bin/ants ./cmd/ants
          go build -o bin/ants-api ./cmd/api

      - name: Deterministic pipeline smoke test (scripted drivers)
        run: ./bin/ants demo run --scm memory --sandbox fake

      - name: Real-execution pipeline smoke test (local git)
        run: ./bin/ants demo run

  contracts:
    name: TypeScript contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate types from the OpenAPI spec
        run: pnpm --filter @ants/contracts generate

      - name: Fail on stale generated output
        run: git diff --exit-code -- packages/contracts/src/schema.d.ts

      - name: Test contracts package
        run: pnpm --filter @ants/contracts test

  web:
    name: Web console gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @ants/web typecheck

      - name: Lint
        run: pnpm --filter @ants/web lint

      - name: Unit and component tests
        run: pnpm --filter @ants/web test

      - name: Production build
        run: pnpm --filter @ants/web build

  web-e2e:
    name: Browser E2E (disposable Keycloak + real API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E against the disposable stack
        run: ./scripts/test-web-e2e.sh

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-artifacts
          path: apps/web/test-results/
          if-no-files-found: ignore
